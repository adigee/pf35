<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlighter — Word-by-Word Stagger</title>
<style>
  :root {
    --color-bg: #121212;
    --color-text: #F8F6EE;
    --color-text-muted: rgba(248, 246, 238, 0.60);
    --highlight-ink: 172, 160, 232;
    --font-body: 'Manrope', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    max-width: 600px;
  }

  .label {
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: 1.5rem;
  }

  .text-block {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.02em;
  }

  .highlight {
    position: relative;
    display: inline;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .highlight .word {
    position: relative;
    display: inline;
  }

  .highlight .word::before {
    content: '';
    position: absolute;
    left: -2px;
    right: -2px;
    top: 0.05em;
    bottom: 0.05em;
    background: rgba(var(--highlight-ink), 0.30);
    border-radius: 2px;
    z-index: -1;
    transform-origin: left center;
    transform: scaleX(1);
    transition: transform 0.12s ease;
  }

  .highlight.removing .word::before {
    transform: scaleX(0);
    transform-origin: right center;
  }

  .highlight.redrawing .word::before {
    transform: scaleX(0);
  }

  .highlight.redrawing .word.redraw-active::before {
    animation: word-sweep 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes word-sweep {
    0% {
      transform: scaleX(0);
      transform-origin: left center;
    }
    100% {
      transform: scaleX(1);
      transform-origin: left center;
    }
  }

  .hint {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: var(--color-text-muted);
    letter-spacing: 0.04em;
  }

  .variant-label {
    display: inline-block;
    margin-top: 3rem;
    font-size: 0.5625rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(var(--highlight-ink), 0.6);
    border: 1px solid rgba(var(--highlight-ink), 0.2);
    border-radius: 999px;
    padding: 4px 12px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="label">Option C — Word-by-Word Stagger</div>

  <p class="text-block">
    The best interactions are the ones you
    <span class="highlight" data-highlight>never notice until they are gone</span>
    and suddenly everything feels broken.
  </p>

  <p class="hint">Click the highlighted phrase to replay the word-by-word stagger.</p>

  <div class="variant-label">Marker Highlighter</div>
</div>

<script>
  document.querySelectorAll('[data-highlight]').forEach(el => {
    const text = el.textContent.trim();
    const words = text.split(/\s+/);
    el.innerHTML = words.map(w => `<span class="word">${w}</span>`).join(' ');

    const wordEls = el.querySelectorAll('.word');

    el.addEventListener('click', () => {
      if (el.classList.contains('redrawing')) return;

      el.classList.add('removing');

      setTimeout(() => {
        el.classList.remove('removing');
        el.classList.add('redrawing');

        wordEls.forEach((word, i) => {
          setTimeout(() => {
            word.classList.add('redraw-active');
          }, i * 70);
        });

        const totalDuration = (wordEls.length - 1) * 70 + 180;
        setTimeout(() => {
          el.classList.remove('redrawing');
          wordEls.forEach(w => w.classList.remove('redraw-active'));
        }, totalDuration);
      }, 160);
    });
  });
</script>
</body>
</html>
