<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlighter — Left-to-Right Sweep</title>
<style>
  :root {
    --color-bg: #121212;
    --color-text: #F8F6EE;
    --color-text-muted: rgba(248, 246, 238, 0.60);
    --highlight-ink: 172, 160, 232;
    --font-body: 'Manrope', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    max-width: 600px;
  }

  .label {
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: 1.5rem;
  }

  .text-block {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: -0.02em;
  }

  .highlight {
    position: relative;
    display: inline;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .highlight::before {
    content: '';
    position: absolute;
    left: -2px;
    right: -2px;
    top: 0.05em;
    bottom: 0.05em;
    background: rgba(var(--highlight-ink), 0.30);
    border-radius: 2px;
    z-index: -1;
    transform-origin: left center;
    transform: scaleX(1);
    transition: transform 0.15s ease;
  }

  .highlight.removing::before {
    transform: scaleX(0);
    transform-origin: right center;
  }

  .highlight.redrawing::before {
    animation: sweep-right 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes sweep-right {
    0% {
      transform: scaleX(0);
      transform-origin: left center;
    }
    100% {
      transform: scaleX(1);
      transform-origin: left center;
    }
  }

  .hint {
    margin-top: 2rem;
    font-size: 0.75rem;
    color: var(--color-text-muted);
    letter-spacing: 0.04em;
  }

  .variant-label {
    display: inline-block;
    margin-top: 3rem;
    font-size: 0.5625rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(var(--highlight-ink), 0.6);
    border: 1px solid rgba(var(--highlight-ink), 0.2);
    border-radius: 999px;
    padding: 4px 12px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="label">Option A — Left-to-Right Sweep</div>

  <p class="text-block">
    Design is the silent ambassador of your brand. It
    <span class="highlight" data-highlight>communicates before words are spoken</span>
    and lingers after the page is closed.
  </p>

  <p class="hint">Click the highlighted phrase to replay the marker sweep.</p>

  <div class="variant-label">Marker Highlighter</div>
</div>

<script>
  document.querySelectorAll('[data-highlight]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('redrawing')) return;

      el.classList.add('removing');

      setTimeout(() => {
        el.classList.remove('removing');
        el.classList.add('redrawing');

        el.addEventListener('animationend', () => {
          el.classList.remove('redrawing');
        }, { once: true });
      }, 160);
    });
  });
</script>
</body>
</html>
