<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Unlocking… — Aditya Gujaran</title>

  <!-- Apply saved theme before first paint (mirror of components/head.js) -->
  <script>
    try {
      var t = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 500 14px/1.6 'Manrope', system-ui, sans-serif; }
    :root[data-theme="dark"]  body { background: #121212; color: rgba(248,246,238,0.60); }
    :root[data-theme="light"] body { background: #FFF3E8; color: rgba(26,42,94,0.68); }
    a { color: inherit; }
  </style>

  <!-- Magic link: seed the same session cookie the password form sets
       (cs_unlock, path=/, session-only), then send the reader on to the
       portfolio. Any protected case study then unlocks silently. -->
  <script>
    document.cookie = 'cs_unlock=' + encodeURIComponent('designforgrowth') + '; path=/; SameSite=Lax';
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Unlocking… <a href="/">Continue to the portfolio</a>.</p>
</body>
</html>
